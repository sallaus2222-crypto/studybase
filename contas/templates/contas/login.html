{% extends "base.html" %}
{% block titulo %}Entrar - StudyVerse{% endblock %}
{% block conteudo %}
<section class="cartao cartao-form">
  <h1>Entrar no StudyVerse</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="botao" type="submit">Entrar</button>
  </form>
  <p class="rodape-form">Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta de aluno</a></p>
</section>
{% endblock %}
